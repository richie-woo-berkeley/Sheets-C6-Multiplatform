name: Push Src To apps-script Branch
on: [push]
env:
  ENCODED_CRED_SECRET: ${{ secrets.GOOGLE_CREDENTIALS }}
jobs:
  Update-AS-Project:
    runs-on: ubuntu-latest
    steps:
      - name: Decode Secrets
        run: |
          if [ ! -x "$(command -v jq)" ]; then
            echo "jq not found, installing..."
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          echo "${{ env.ENCODED_CRED_SECRET }}" | base64 --decode | jq -r 'to_entries[] | "\(.key)=\(.value)"' | while read line; do echo "$line" >> $GITHUB_ENV; echo "::add-mask::${line#*=}"; done

      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Change js to gs
        run: find /home/runner/work/Sheets-C6-Multiplatform/Sheets-C6-Multiplatform/src -depth -name "*.js" -exec sh -c 'mv "$1" "${1%.js}.gs"' _ {} \;

      - name: Push To apps-script Branch
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: apps-script
          FOLDER: src
          TARGET_DIR: src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate Service Account
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}' 
          token_format: access_token
          access_token_scopes: "https://www.googleapis.com/auth/script.projects"

      - name: Push Script Code
        uses: shiftavenue/gas-action@v0
        with:
          # Use push command
          command: push
          project-id: ${{ secrets.PROJECT_ID }}
          access-token: ${{ steps.google-auth.outputs.access_token }}
          script-dir: src